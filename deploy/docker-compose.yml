# Production stack for one VPS (e.g. Hostinger KVM). See deploy/README.md.
#
# Lives in the backend repository. The website image is built from the frontend repository,
# which must be cloned next to this one (WEB_DIR in .env, default ../../Portfolio-Web):
#
#   /opt/portfolio/Portfolio-API   <- this repository
#   /opt/portfolio/Portfolio-Web   <- frontend repository
#
#   cd Portfolio-API/deploy
#   cp .env.example .env      then fill in the values
#   docker compose up -d --build
#
# Three containers on a private Docker network:
#   db   PostgreSQL 18.6, data in the "pgdata" volume, not reachable from outside
#   api  ASP.NET Core (.NET 10), not reachable from outside, only through Caddy
#   web  Caddy: serves the React build, proxies /api /mcp /health, handles HTTPS
name: portfolio

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Double underscore = nested setting: ConnectionStrings:Default, Jwt:SigningKey, ...
      ConnectionStrings__Default: Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in deploy/.env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
      Admin__AllowedEmails__0: ${ADMIN_EMAIL:?set ADMIN_EMAIL in deploy/.env}
      # Apply migrations and create the Admin role, projects and draft posts on start (only what is missing).
      Database__MigrateOnStartup: "true"

  web:
    build:
      # The frontend repository (Dockerfile and Caddyfile live there).
      context: ${WEB_DIR:-../../Portfolio-Web}
      args:
        VITE_SITE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
        VITE_API_URL: https://${DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates live here; keep this volume or Let's Encrypt limits can bite on rebuilds.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
