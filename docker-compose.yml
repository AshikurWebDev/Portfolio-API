# PostgreSQL for local development.
# Same major/minor version as the PostgreSQL 18.6 installed on this machine, so
# dumps and psql work across both without version mismatches.
# Host port 55432 avoids clashing with other PostgreSQL servers on 5432.
#
#   docker compose up -d      start
#   docker compose down       stop (data is kept in the named volume)
#   docker compose down -v    stop and DELETE the data
services:
  postgres:
    image: postgres:18.6
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      # Development-only password; also in appsettings.Development.json. Never reuse it in production.
      POSTGRES_PASSWORD: portfolio_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - portfolio-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-pgdata:
